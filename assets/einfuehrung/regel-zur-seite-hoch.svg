="translate(14 238) scale(1.000)"><path d="M10 22V7a1 1 0 0 0-1-1H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5a1 1 0 0 0-1-1H2"/><rect x="14" y="2" width="8" height="8" rx="1"/></g><text class="t" x="236" y="260" text-anchor="end" style="font-size:24px;font-weight:700;opacity:.55">3</text><text class="t" x="48" y="257">Baustein</text><text class="m" x="14" y="284" style="font-weight:400">im Kit, mit Doku und Story</text></g></a><path class="flow flowan" style="animation-delay:0.4s" d="M125 302 V316"/><a href="../storybook/index.html#story=grundlagen-tokens-farben-rollen-km" target="_top" class="lk"><title>Prüfung: ansehen</title><g style="--fb:var(--km-color-data-2)"><rect class="f schritt" style="animation-delay:6s" x="0" y="318" width="250" height="78"/><rect class="kante" x="0" y="318" width="250" height="4"/><g class="ic" transform="translate(14 334) scale(1.000)"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></g><text class="t" x="236" y="356" text-anchor="end" style="font-size:24px;font-weight:700;opacity:.55">4</text><text class="t" x="48" y="353">Prüfung</text><text class="m" x="14" y="380" style="font-weight:400">misst, statt zu behaupten</text></g></a><path class="flow flowan" style="animation-delay:0.6000000000000001s" d="M125 398 V412"/><a href="../storybook/index.html#tab=prototyp" target="_top" class="lk"><title>Seite: ansehen</title><g style="--fb:var(--km-color-data-2)"><rect class="a" style="animation-delay:8s" x="0" y="414" width="250" height="78"/><g class="icon" transform="translate(14 430) scale(1.000)"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g><text class="c" x="236" y="452" text-anchor="end" style="font-size:24px;font-weight:700;opacity:.55">5</text><text class="c" x="48" y="449">Seite</text><text class="c" x="14" y="476" style="font-weight:400">Mensch oder Agent baut</text></g></a></g>
</svg>
