mix: alle Versionen im Changelog</title><rect class="a puls" x="0" y="532" width="250" height="84"/><g class="icon" transform="translate(14 556) scale(1.333)"><path d="M10 8h4"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M17 16h4"/><path d="M19 12V3"/><path d="M19 21v-5"/><path d="M3 14h4"/><path d="M5 10V3"/><path d="M5 21v-7"/></g><text class="c" x="60" y="572" style="font-size:22px">Kernmix</text><text class="c" x="60" y="596" style="font-size:13px;font-weight:600">Ein Remix von KERN</text></a><path class="flow flowan" d="M125 620 V644"/><text class="k" x="0" y="664">AUSGÄNGE</text><a href="../storybook/index.html#tab=prototyp" target="_top" class="lk"><title>Das Dashboard als Prototyp ansehen</title><g style="--fb:var(--km-color-accent)"><rect class="f out" style="animation-delay:0s" x="0" y="676" width="250" height="46"/><rect class="kante" x="0" y="676" width="4" height="46"/><g class="ic" transform="translate(16 689) scale(0.833)"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></g><text class="t" x="48" y="705">Project Dashboard</text></g></a><g style="--fb:var(--km-color-accent)"><rect class="f out" style="animation-delay:1s" x="0" y="732" width="250" height="46"/><rect class="kante" x="0" y="732" width="4" height="46"/><g class="ic" transform="translate(16 745) scale(0.833)"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g><text class="t" x="48" y="761">Lagebild</text></g><g style="--fb:var(--km-color-accent)"><rect class="f out" style="animation-delay:2s" x="0" y="788" width="250" height="46"/><rect class="kante" x="0" y="788" width="4" height="46"/><g class="ic" transform="translate(16 801) scale(0.833)"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/