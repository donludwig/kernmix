<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 470" role="img" aria-labelledby="t d" font-family="inherit">
<title id="t">Token-Ebenen</title><desc id="d">Vier Ebenen nach KERN: Grundwerte, Core Token, Semantische Token und Komponenten-Token. Bausteine lesen nur semantische und Komponenten-Token. Jede Ebene führt zur passenden Seite.</desc>
<style>
.f{fill:var(--km-color-card,#151d33);stroke:var(--km-color-border-section,#3d4a70);stroke-width:1.5;transition:stroke .2s,fill .2s}
.i{fill:var(--km-color-inset,#1b253e);stroke:var(--km-color-border-card,#2c3756);stroke-width:1.5}
.a{fill:var(--fb,var(--km-color-accent,#8fa6ff))}
.kante{fill:var(--fb,var(--km-color-accent,#8fa6ff))}
.l{stroke:var(--km-color-border-section,#3d4a70);stroke-width:2;fill:none}
.flow{stroke:var(--fb,var(--km-color-accent,#8fa6ff));stroke-width:2.5;fill:none;stroke-dasharray:7 9}
.h{fill:var(--km-color-text,#e8ecf8);font-size:22px;font-weight:700}
.t{fill:var(--km-color-text,#e8ecf8);font-size:17px;font-weight:600}
.m{fill:var(--km-color-text-muted,#b4bdd6);font-size:14px}
.k{fill:var(--km-color-text-dim,#8c96b3);font-size:12px;letter-spacing:.08em;font-weight:600}
.c{fill:var(--km-color-on-accent,#0c1120);font-size:15px;font-weight:700}
.ic{fill:none;stroke:var(--fb,var(--km-color-accent,#8fa6ff));stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon{fill:none;stroke:var(--km-color-on-accent,#0c1120);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lk{cursor:pointer;outline:none}
.lk:hover .f,.lk:focus-visible .f{stroke:var(--fb,var(--km-color-accent,#8fa6ff));fill:var(--km-color-inset,#1b253e)}
.lk:focus-visible .f{stroke-width:3}
.anim{animation-play-state:running}
.flowan{animation:kmfxflow 1.1s linear infinite}
.fader{animation:kmfxfader 5s ease-in-out infinite alternate;transform-box:fill-box}
.puls{animation:kmfxpuls 3.2s ease-in-out infinite}
.out{animation:kmfxout 4s ease-in-out infinite}
.ebene{animation:kmfxein .7s ease-out both}
.tropfen{animation:kmfxtropfen 2.8s linear infinite}
.schritt{animation:kmfxschritt 10s ease-in-out infinite}
.at{fill:var(--km-color-attention,#f59e0b)}
.ca{fill:var(--km-color-on-attention,#0e1324);font-size:15px;font-weight:700}
.ica{fill:none;stroke:var(--km-color-attention,#f59e0b);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconat{fill:none;stroke:var(--km-color-on-attention,#0e1324);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lu{fill:none;stroke:var(--km-color-attention,#f59e0b);stroke-width:2;stroke-dasharray:6 6}
.luan{animation:kmfxflow 1.6s linear infinite}
.mono{font-family:var(--km-font-mono,monospace)}
.lk:hover .a,.lk:focus-visible .a,.lk:hover .at,.lk:focus-visible .at{stroke:var(--km-color-text,#e8ecf8);stroke-width:2}
@keyframes kmfxflow{to{stroke-dashoffset:-32}}
@keyframes kmfxfader{0%{transform:translateY(0)}100%{transform:translateY(var(--weg,40px))}}
@keyframes kmfxpuls{0%,100%{opacity:1}50%{opacity:.82}}
@keyframes kmfxout{0%,100%{stroke:var(--km-color-border-section,#3d4a70)}12%,30%{stroke:var(--fb,var(--km-color-accent,#8fa6ff))}}
@keyframes kmfxein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes kmfxtropfen{from{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}to{transform:translateY(330px);opacity:0}}
@keyframes kmfxschritt{0%,100%{stroke:var(--km-color-border-section,#3d4a70);stroke-width:1.5}8%,18%{stroke:var(--fb,var(--km-color-accent,#8fa6ff));stroke-width:3}}
@media (prefers-reduced-motion: reduce){.flowan,.fader,.puls,.out,.ebene,.tropfen,.schritt,.luan{animation:none}}
</style>
<g style="--fb:var(--km-color-data-5)"><text class="k" x="40" y="40">TOKEN-EBENEN WIE BEI KERN</text><line class="l" x1="70" y1="78" x2="70" y2="400" style="stroke-dasharray:3 6"/><circle class="a tropfen" cx="70" cy="70" r="5"/><circle class="a tropfen" style="animation-delay:1.4s" cx="70" cy="70" r="5"/><a href="../storybook/index.html#story=grundlagen-tokens-farben-kern-palette" target="_top" class="lk"><title>Grundwerte: ansehen</title><g style="--fb:var(--km-color-data-5)"><rect class="f ebene" style="animation-delay:0.0s" x="100" y="70" width="1120" height="72"/><rect class="kante ebene" style="animation-delay:0.0s" x="100" y="70" width="4" height="72"/><g class="ebene" style="animation-delay:0.0s"><g class="ic" transform="translate(122 94) scale(1.000)"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></g><text class="t" x="162" y="101" style="font-size:19px">Grundwerte</text><text class="m" x="162" y="125" style="font-weight:400">rohe Werte ohne Bedeutung</text><text class="m" x="1196" y="113" text-anchor="end" style="font-family:var(--km-font-mono,monospace);font-weight:400">#3451c6 · 16px · 0,16</text></g></g></a><a href="../storybook/index.html#story=grundlagen-tokens-farben-kern-palette" target="_top" class="lk"><title>Core Token: ansehen</title><g style="--fb:var(--km-color-data-5)"><rect class="f ebene" style="animation-delay:0.18s" x="100" y="162" width="1120" height="72"/><rect class="kante ebene" style="animation-delay:0.18s" x="100" y="162" width="4" height="72"/><g class="ebene" style="animation-delay:0.18s"><g class="ic" transform="translate(122 186) scale(1.000)"><path d="M11 17a4 4 0 0 1-8 0V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2Z"/><path d="M16.7 13H19a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H7"/><path d="M 7 17h.01"/><path d="m11 8 2.3-2.3a2.4 2.4 0 0 1 3.404.004L18.6 7.6a2.4 2.4 0 0 1 .026 3.434L9.9 19.8"/></g><text class="t" x="162" y="193" style="font-size:19px">Core Token</text><text class="m" x="162" y="217" style="font-weight:400">benannte Skalen und Farbreihen</text><text class="m" x="1196" y="205" text-anchor="end" style="font-family:var(--km-font-mono,monospace);font-weight:400">--kern-color-darkblue-500 · --kern-16</text></g></g></a><a href="../storybook/index.html#story=grundlagen-tokens-farben-rollen-km" target="_top" class="lk"><title>Semantische Token: ansehen</title><g style="--fb:var(--km-color-data-5)"><rect class="a ebene" style="animation-delay:0.36s" x="100" y="254" width="1120" height="72"/><g class="ebene" style="animation-delay:0.36s"><g class="icon" transform="translate(122 278) scale(1.000)"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></g><text class="c" x="162" y="285" style="font-size:19px">Semantische Token</text><text class="c" x="162" y="309" style="font-weight:400">Bedeutung: wofür ein Wert steht</text><text class="c" x="1196" y="297" text-anchor="end" style="font-family:var(--km-font-mono,monospace);font-weight:400">--km-color-accent · --km-space-s</text></g></g></a><a href="../storybook/index.html#story=erweiterungen-werkzeug-bausteine-km-seitenleiste" target="_top" class="lk"><title>Komponente: ansehen</title><g style="--fb:var(--km-color-data-5)"><rect class="f ebene" style="animation-delay:0.54s" x="100" y="346" width="1120" height="72"/><rect class="kante ebene" style="animation-delay:0.54s" x="100" y="346" width="4" height="72"/><g class="ebene" style="animation-delay:0.54s"><g class="ic" transform="translate(122 370) scale(1.000)"><path d="M15.536 11.293a1 1 0 0 0 0 1.414l2.376 2.377a1 1 0 0 0 1.414 0l2.377-2.377a1 1 0 0 0 0-1.414l-2.377-2.377a1 1 0 0 0-1.414 0z"/><path d="M2.297 11.293a1 1 0 0 0 0 1.414l2.377 2.377a1 1 0 0 0 1.414 0l2.377-2.377a1 1 0 0 0 0-1.414L6.088 8.916a1 1 0 0 0-1.414 0z"/><path d="M8.916 17.912a1 1 0 0 0 0 1.415l2.377 2.376a1 1 0 0 0 1.414 0l2.377-2.376a1 1 0 0 0 0-1.415l-2.377-2.376a1 1 0 0 0-1.414 0z"/><path d="M8.916 4.674a1 1 0 0 0 0 1.414l2.377 2.376a1 1 0 0 0 1.414 0l2.377-2.376a1 1 0 0 0 0-1.414l-2.377-2.377a1 1 0 0 0-1.414 0z"/></g><text class="t" x="162" y="377" style="font-size:19px">Komponente</text><text class="m" x="162" y="401" style="font-weight:400">Typ component im Namen, je Baustein</text><text class="m" x="1196" y="389" text-anchor="end" style="font-family:var(--km-font-mono,monospace);font-weight:400">--km-component-sidebar-width</text></g></g></a><text class="m" x="40" y="452">Bausteine lesen nur semantische und Komponenten-Token. Themes setzen nur Werte, nie Regeln.</text></g>
</svg>
